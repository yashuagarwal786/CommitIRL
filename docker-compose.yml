services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: commitirl
      POSTGRES_PASSWORD: commitirl
      POSTGRES_DB: commitirl
    ports:
      - "5432:5432"
    volumes:
      - commitirl_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U commitirl -d commitirl"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  commitirl_pg:
